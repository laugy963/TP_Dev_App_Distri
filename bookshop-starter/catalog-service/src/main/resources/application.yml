spring:
  application:
    name: catalog-service
  config:
    # Rang 4 (configuration externe) : optionnel tant que le Config Server n'existe pas (TP2)
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: jdbc:postgresql://localhost:5432/catalogdb
    username: bookshop
    password: bookshop
  jpa:
    open-in-view: false
    hibernate:
      # validate : Hibernate vérifie le schéma sans le modifier (Flyway le gérera au TP8)
      ddl-auto: validate

server:
  port: 8081

app:
  welcome-message: "Bienvenue (fichier interne)"
  features:
    discount-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,conditions,refresh
