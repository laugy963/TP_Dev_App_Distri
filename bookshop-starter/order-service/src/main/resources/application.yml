server:
  port: 8082

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: bookshop
    password: bookshop
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

app:
  catalog:
    # TP3 : nom logique du service, traduit par l'annuaire Eureka (plus d'adresse en dur)
    url: http://catalog-service

management:
  endpoints:
    web:
      exposure:
        include: health,info

# TP3 : adresse de l'annuaire Eureka (discovery-server)
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
