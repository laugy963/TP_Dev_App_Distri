server:
  port: 8080

spring:
  application:
    name: gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      # Une route = "si le chemin correspond à Path, envoie la requête à uri".
      # lb:// = demande l'adresse à l'annuaire Eureka et répartis la charge (comme @LoadBalanced au TP3)
      routes:
        - id: catalog
          uri: lb://catalog-service
          predicates:
            - Path=/api/books/**,/api/welcome
        - id: orders
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
        - id: bff
          uri: lb://bff-web
          predicates:
            - Path=/bff/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoint:
    gateway:
      # Spring Cloud Gateway 4.1.x : endpoint désactivé par défaut, l'exposer ne suffit pas
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,gateway
